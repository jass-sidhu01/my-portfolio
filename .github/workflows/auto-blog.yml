name: Auto Generate Punjabi Movie Blog

on:
  schedule:
    - cron: '0 4 * * *'  # Runs every day at 9:30 AM IST (4:00 AM UTC)
  workflow_dispatch:       # Allow manual trigger from GitHub

jobs:
  generate-blog:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Generate blog post
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: node scripts/generate-blog.js

      - name: Check if new blog was created
        id: check_changes
        run: |
          git diff --quiet src/blogs/ || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push new blog
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git config --global user.email "ijasssidhu855@gmail.com"
          git config --global user.name "Jaskaran Sidhu"
          git add src/blogs/
          git commit -m "🎬 Auto blog: Punjabi Movie Update $(date +'%Y-%m-%d')"
          git push
